<VirtualHost *:80>
    ServerName scancare.it.com
    ServerAlias www.scancare.it.com
    DocumentRoot /var/www/scancare

    <Directory /var/www/scancare>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/scancare/database>
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/scancare_error.log
    CustomLog ${APACHE_LOG_DIR}/scancare_access.log combined
</VirtualHost>
